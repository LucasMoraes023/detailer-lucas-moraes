name: Build Web + Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build detailer-app
        env:
          PORT: "3000"
          BASE_PATH: "/"
          NODE_ENV: production
        run: pnpm --filter @workspace/detailer-app run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: detailer-app-web
          path: artifacts/detailer-app/dist/public
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web bundle
        env:
          PORT: "3000"
          BASE_PATH: "/"
          NODE_ENV: production
        run: pnpm --filter @workspace/detailer-app run build

      - name: Add Android platform (if missing)
        working-directory: artifacts/detailer-app
        run: |
          if [ ! -d "android" ]; then
            pnpm exec cap add android
          fi
          pnpm exec cap sync android

      - name: Grant gradlew permission
        working-directory: artifacts/detailer-app/android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: artifacts/detailer-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: detailer-app-debug.apk
          path: artifacts/detailer-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
